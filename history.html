<script>
    // Auth Check
    const token = localStorage.getItem('adEngine_token');
    if (!token) window.location.href = 'login.html';

    // Sidebar Logic
    const sidebarMenu = document.getElementById('sidebar-menu');
    const sidebarPanel = document.getElementById('sidebar-panel');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const closeMenuBtn = document.getElementById('close-menu-btn');

    function openSidebar() {
        sidebarMenu.classList.remove('hidden');
        void sidebarMenu.offsetWidth;
        sidebarBackdrop.classList.remove('opacity-0');
        sidebarBackdrop.classList.add('opacity-100');
        sidebarPanel.classList.remove('-translate-x-full');
        sidebarPanel.classList.add('translate-x-0');
    }

    function closeSidebar() {
        sidebarBackdrop.classList.remove('opacity-100');
        sidebarBackdrop.classList.add('opacity-0');
        sidebarPanel.classList.remove('translate-x-0');
        sidebarPanel.classList.add('-translate-x-full');
        setTimeout(() => {
            sidebarMenu.classList.add('hidden');
        }, 300);
    }

    if(hamburgerBtn) hamburgerBtn.addEventListener('click', openSidebar);
    if(closeMenuBtn) closeMenuBtn.addEventListener('click', closeSidebar);
    if(sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const res = await fetch('/api/history', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success && data.campaigns && data.campaigns.length > 0) {
                const container = document.getElementById('history-container');
                container.classList.remove('py-12', 'items-center', 'text-center');
                container.classList.add('grid', 'grid-cols-1', 'md:grid-cols-2', 'gap-6');
                
                window.filteredCampaigns = data.campaigns.filter(c => c.scripts && c.scripts.length > 0);
                window.viewScript = function(index) {
                    const c = window.filteredCampaigns[index];
                    localStorage.setItem('adEngine_vars', JSON.stringify({niche: c.niche, painPoint: c.pain_point, heroSolution: c.hero_solution, vibe: c.vibe, localAnchor: c.local_anchor})); 
                    localStorage.setItem('adEngine_generatedScript', c.scripts[0].content); 
                    localStorage.setItem('adEngine_campaignId', c.id); 
                    window.location.href='showcase_output.html';
                };

                container.innerHTML = window.filteredCampaigns.map((c, index) => {
                    const scriptRaw = c.scripts[0].content;
                    let scriptLines = "Hook preview...";
                    try {
                        const parsed = JSON.parse(scriptRaw);
                        scriptLines = `"${parsed.hook.substring(0, 80)}..."`;
                    } catch(e) {}

                    return `
                    <div class="bg-surface-container-low border border-outline-variant/30 rounded-2xl p-6 flex flex-col justify-between items-start hover:shadow-lg transition-all hover:-translate-y-1">
                        <div class="w-full">
                            <div class="flex justify-between items-center w-full mb-3">
                                <span class="inline-block px-3 py-1 bg-secondary-container text-on-secondary-container text-[10px] font-bold uppercase tracking-widest rounded-full">${new Date(c.scripts[0].created_at).toLocaleDateString()}</span>
                                ${c.scripts[0].is_refined ? '<span class="text-xs font-bold text-secondary flex items-center gap-1"><span class="material-symbols-outlined text-sm">autorenew</span> Refined</span>' : ''}
                            </div>
                            <h3 class="font-headline text-xl font-black text-primary mb-2">${c.niche} Script</h3>
                            <p class="text-sm font-medium text-stone-500 italic line-clamp-3 mb-4">${scriptLines}</p>
                        </div>
                        <button onclick="viewScript(${index})" class="w-full mt-2 px-6 py-2 bg-primary-container text-surface rounded-full font-bold text-sm shadow hover:scale-105 transition-transform flex justify-center items-center gap-2">
                            <span class="material-symbols-outlined text-sm">visibility</span> View Script
                        </button>
                    </div>
                `}).join('');
            }
        } catch (e) {
            console.error("Failed to load history", e);
        }
    });
</script>
